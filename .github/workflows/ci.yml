name: CI

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      version:
        description: Release version without the v prefix
        required: true

permissions:
  contents: read

jobs:
  release-metadata:
    name: Release metadata
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    outputs:
      version: ${{ steps.version.outputs.value }}

    steps:
      - name: Resolve release version
        id: version
        shell: bash
        env:
          MANUAL_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$MANUAL_VERSION"
          fi

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release version: $version" >&2
            exit 1
          fi

          echo "value=$version" >> "$GITHUB_OUTPUT"

  portable-build-and-test:
    name: Portable build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest
          - macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore portable solution
        run: dotnet restore build/RobotStudio.Portable.slnx

      - name: Build portable solution
        run: dotnet build build/RobotStudio.Portable.slnx --configuration Release --no-restore

      - name: Test portable solution
        run: dotnet test build/RobotStudio.Portable.slnx --configuration Release --no-build --logger "trx;LogFilePrefix=test-results" --results-directory TestResults/${{ matrix.os }}

      - name: Upload portable test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portable-test-results-${{ matrix.os }}
          path: TestResults/${{ matrix.os }}/**/*.trx
          if-no-files-found: ignore

  build-and-test:
    name: Windows desktop build and test
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore full solution
        run: dotnet restore RobotStudio.slnx

      - name: Build full solution
        run: dotnet build RobotStudio.slnx --configuration Release --no-restore

      - name: Test full solution
        run: dotnet test RobotStudio.slnx --configuration Release --no-build --logger "trx;LogFilePrefix=test-results" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/**/*.trx
          if-no-files-found: ignore

  code-quality:
    name: Code quality
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore RobotStudio.slnx

      - name: Verify formatting
        run: dotnet format RobotStudio.slnx --verify-no-changes --verbosity diagnostic

  windows-installer:
    name: Windows installer
    runs-on: windows-latest
    needs:
      - build-and-test
      - code-quality
      - release-metadata
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore RobotStudio.slnx

      - name: Prepare optional signing certificate
        shell: pwsh
        env:
          ROBOTSTUDIO_SIGNING_CERTIFICATE_BASE64: ${{ secrets.ROBOTSTUDIO_SIGNING_CERTIFICATE_BASE64 }}
        run: |
          if (-not [string]::IsNullOrWhiteSpace($env:ROBOTSTUDIO_SIGNING_CERTIFICATE_BASE64)) {
            $certificatePath = Join-Path $env:RUNNER_TEMP "robotstudio-signing.pfx"
            [System.IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:ROBOTSTUDIO_SIGNING_CERTIFICATE_BASE64))
            "ROBOTSTUDIO_SIGNING_CERTIFICATE_PATH=$certificatePath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }

      - name: Build Windows installer
        shell: pwsh
        env:
          ROBOTSTUDIO_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.ROBOTSTUDIO_SIGNING_CERTIFICATE_PASSWORD }}
          ROBOTSTUDIO_SIGNING_CERTIFICATE_THUMBPRINT: ${{ secrets.ROBOTSTUDIO_SIGNING_CERTIFICATE_THUMBPRINT }}
          ROBOTSTUDIO_SIGNING_TIMESTAMP_URL: ${{ vars.ROBOTSTUDIO_SIGNING_TIMESTAMP_URL }}
        run: ./scripts/release/build-windows-installer.ps1 -Version '${{ needs.release-metadata.outputs.version }}' -Runtime win-x64

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: robotstudio-${{ needs.release-metadata.outputs.version }}-windows-installer
          path: |
            artifacts/release/RobotStudio-${{ needs.release-metadata.outputs.version }}-win-x64-setup.exe
            artifacts/release/RobotStudio-${{ needs.release-metadata.outputs.version }}-win-x64-setup.exe.sha256
          if-no-files-found: error

  cli-release-artifacts:
    name: CLI release artifact (${{ matrix.runtime }})
    runs-on: ${{ matrix.os }}
    needs:
      - portable-build-and-test
      - code-quality
      - release-metadata
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            runtime: win-x64
          - os: ubuntu-latest
            runtime: linux-x64
          - os: macos-latest
            runtime: osx-x64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore portable solution
        run: dotnet restore build/RobotStudio.Portable.slnx

      - name: Build CLI artifact
        shell: pwsh
        run: ./scripts/release/build-cli-artifact.ps1 -Version '${{ needs.release-metadata.outputs.version }}' -Runtime ${{ matrix.runtime }}

      - name: Upload CLI artifact
        uses: actions/upload-artifact@v4
        with:
          name: robotstudio-${{ needs.release-metadata.outputs.version }}-cli-${{ matrix.runtime }}
          path: |
            artifacts/release/RobotStudio-${{ needs.release-metadata.outputs.version }}-cli-${{ matrix.runtime }}.zip
            artifacts/release/RobotStudio-${{ needs.release-metadata.outputs.version }}-cli-${{ matrix.runtime }}.zip.sha256
          if-no-files-found: error

  github-release:
    name: GitHub release
    runs-on: ubuntu-latest
    needs:
      - windows-installer
      - cli-release-artifacts
      - release-metadata
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Prepare release assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Get-ChildItem -Path release-artifacts -Recurse -File |
            Where-Object { $_.Name -match '\.(exe|zip|sha256)$' } |
            Copy-Item -Destination dist
          Get-ChildItem -Path dist -File

      - name: Prepare release notes
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.release-metadata.outputs.version }}
        run: |
          $content = Get-Content -LiteralPath CHANGELOG.md -Raw
          $version = [Regex]::Escape($env:RELEASE_VERSION)
          $match = [Regex]::Match($content, "(?ms)^## $version\b.*?(?=^## \d|\z)")
          if (-not $match.Success) {
            throw "CHANGELOG.md does not contain a release section for $env:RELEASE_VERSION."
          }
          $match.Value.Trim() | Set-Content -LiteralPath release-notes.md -Encoding utf8

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "RobotStudio $version" \
            --notes-file release-notes.md \
            --verify-tag
