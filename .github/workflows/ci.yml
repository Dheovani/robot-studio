name: CI

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore RobotStudio.slnx

      - name: Build
        run: dotnet build RobotStudio.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test RobotStudio.slnx --configuration Release --no-build --logger "trx;LogFilePrefix=test-results" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/**/*.trx
          if-no-files-found: ignore

  code-quality:
    name: Code quality
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore RobotStudio.slnx

      - name: Verify formatting
        run: dotnet format RobotStudio.slnx --verify-no-changes --verbosity diagnostic

  windows-installer:
    name: Windows installer
    runs-on: windows-latest
    needs:
      - build-and-test
      - code-quality
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore RobotStudio.slnx

      - name: Prepare optional signing certificate
        shell: pwsh
        env:
          ROBOTSTUDIO_SIGNING_CERTIFICATE_BASE64: ${{ secrets.ROBOTSTUDIO_SIGNING_CERTIFICATE_BASE64 }}
        run: |
          if (-not [string]::IsNullOrWhiteSpace($env:ROBOTSTUDIO_SIGNING_CERTIFICATE_BASE64)) {
            $certificatePath = Join-Path $env:RUNNER_TEMP "robotstudio-signing.pfx"
            [System.IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:ROBOTSTUDIO_SIGNING_CERTIFICATE_BASE64))
            "ROBOTSTUDIO_SIGNING_CERTIFICATE_PATH=$certificatePath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }

      - name: Build Windows installer
        shell: pwsh
        env:
          ROBOTSTUDIO_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.ROBOTSTUDIO_SIGNING_CERTIFICATE_PASSWORD }}
          ROBOTSTUDIO_SIGNING_CERTIFICATE_THUMBPRINT: ${{ secrets.ROBOTSTUDIO_SIGNING_CERTIFICATE_THUMBPRINT }}
          ROBOTSTUDIO_SIGNING_TIMESTAMP_URL: ${{ vars.ROBOTSTUDIO_SIGNING_TIMESTAMP_URL }}
        run: ./scripts/release/build-windows-installer.ps1 -Version 1.0.0 -Runtime win-x64

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: robotstudio-1.0.0-windows-installer
          path: |
            artifacts/release/RobotStudio-1.0.0-win-x64-setup.exe
            artifacts/release/RobotStudio-1.0.0-win-x64-setup.exe.sha256
          if-no-files-found: error
